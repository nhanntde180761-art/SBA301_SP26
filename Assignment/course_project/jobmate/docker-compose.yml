version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobmate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8.0.1-noble
    hostname: mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.12
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  jobmate-connect:
    build:
      context: ./jobmate-connect
      dockerfile: Dockerfile
    container_name: jobmate-connect
    depends_on:
      - postgres
      - redis
      - kafka
      - elasticsearch
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Override các cấu hình "localhost" trong application.yaml để trỏ vào các container tương ứng
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobmate_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"

  notification-service:
    build:
      context: ./Notification-Service
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      - redis
      - kafka
    environment:
      SERVER_PORT: 8081
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"

  chat-service:
    build:
      context: ./Chat-Service
      dockerfile: Dockerfile
    container_name: chat-service
    depends_on:
      - mongodb
      - jobmate-connect
    environment:
      SERVER_PORT: 8082
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # MongoDB connection
      SPRING_DATA_MONGODB_URI: mongodb://root:root@mongodb:27017/chat-service?authSource=admin

      # Feign client tới jobmate-connect (giữ nguyên context-path /jobmate)
      FEIGN_CLIENT_CONFIG_JOBMATE_CONNECT_URL: http://jobmate-connect:8080/jobmate
      FEIGN_CLIENT_CONFIG_JOBMATE_CONNECT_CONNECT_TIMEOUT: 5000
      FEIGN_CLIENT_CONFIG_JOBMATE_CONNECT_READ_TIMEOUT: 10000
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - jobmate-connect
      - notification-service
      - chat-service
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Dùng file application-docker.yaml đã cấu hình sẵn uri theo tên service
      SPRING_CONFIG_NAME: application-docker
      # Để WebClient trong api-gateway gọi đúng vào service jobmate-connect trong network Docker
      JOBMATE_CONNECT_URL: http://jobmate-connect:8080/jobmate
    ports:
      - "8888:8888"
    healthcheck:
      # Check health endpoint via TCP port (Spring Boot Actuator)
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  es_data:
